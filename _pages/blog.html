---
layout: page
prompt: "cat posts/*.md"
prose: false
title: Blog
subtitle: Thoughts on software development and technology
---

<section class="blog-page">
  <p class="blog-source">
    <i class="ti-wordpress" aria-hidden="true"></i>
    Also published on
    <a href="https://karanbuilds.wordpress.com" target="_blank" rel="noopener noreferrer">karanbuilds.wordpress.com</a>
  </p>

  <!-- Posts injected here by JS; skeletons show while loading -->
  <div id="blog-list" class="blog-list" aria-live="polite" aria-busy="true">
    <div class="blog-skeleton blog-skeleton-featured"></div>
    <div class="blog-skeleton"></div>
    <div class="blog-skeleton"></div>
    <div class="blog-skeleton"></div>
  </div>
</section>

<script>
(function () {
  var list = document.getElementById('blog-list');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* WordPress returns HTML; turn it into plain text */
  function toText(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return (tmp.textContent || '').trim();
  }

  function readingTime(html) {
    var words = toText(html).split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 220)) + ' min read';
  }

  function formatDate(iso, opts) {
    return new Date(iso).toLocaleDateString('en-AU', opts);
  }

  function safeUrl(url) {
    return /^https:\/\//.test(url) ? url : '#';
  }

  function renderFeatured(post) {
    var tags = Object.keys(post.tags || {}).slice(0, 3);
    return '<a class="blog-featured" href="' + safeUrl(post.URL) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="blog-featured-label"><span class="blog-featured-dot"></span>Latest post</span>' +
      '<span class="blog-meta">' + formatDate(post.date, { day: 'numeric', month: 'long', year: 'numeric' }) +
        ' &middot; ' + readingTime(post.content) + '</span>' +
      '<h2 class="blog-featured-title">' + escapeHtml(toText(post.title)) + '</h2>' +
      '<p class="blog-featured-excerpt">' + escapeHtml(toText(post.excerpt).replace(/\s*\[…\]\s*$/, '…')) + '</p>' +
      '<span class="blog-featured-footer">' +
        '<span class="blog-tags">' + tags.map(function (t) { return '<span>' + escapeHtml(t) + '</span>'; }).join('') + '</span>' +
        '<span class="blog-read">Read on WordPress <i class="ti-arrow-top-right"></i></span>' +
      '</span>' +
    '</a>';
  }

  function renderRow(post) {
    var excerpt = toText(post.excerpt).replace(/\s*\[…\]\s*$/, '…');
    if (excerpt.length > 150) excerpt = excerpt.slice(0, 150).trim() + '…';
    return '<a class="blog-row" href="' + safeUrl(post.URL) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="blog-row-date">' +
        '<span class="blog-row-day">' + formatDate(post.date, { day: '2-digit' }) + '</span>' +
        '<span class="blog-row-month">' + formatDate(post.date, { month: 'short', year: 'numeric' }) + '</span>' +
      '</span>' +
      '<span class="blog-row-body">' +
        '<span class="blog-row-title">' + escapeHtml(toText(post.title)) + '</span>' +
        '<span class="blog-row-excerpt">' + escapeHtml(excerpt) + '</span>' +
      '</span>' +
      '<span class="blog-row-meta">' + readingTime(post.content) + '</span>' +
      '<span class="blog-row-arrow" aria-hidden="true"><i class="ti-arrow-right"></i></span>' +
    '</a>';
  }

  function showError() {
    list.setAttribute('aria-busy', 'false');
    list.innerHTML = '<p class="blog-empty">Could not load posts. ' +
      '<a href="https://karanbuilds.wordpress.com" target="_blank" rel="noopener noreferrer">Visit the blog directly &rarr;</a></p>';
  }

  fetch('https://public-api.wordpress.com/rest/v1.1/sites/karanbuilds.wordpress.com/posts/?number=20&fields=title,URL,date,excerpt,content,tags')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      list.setAttribute('aria-busy', 'false');
      if (!data.posts || data.posts.length === 0) {
        list.innerHTML = '<p class="blog-empty">No posts yet.</p>';
        return;
      }
      var posts = data.posts;
      list.innerHTML = renderFeatured(posts[0]) +
        (posts.length > 1 ? '<div class="blog-rows">' + posts.slice(1).map(renderRow).join('') + '</div>' : '');

      if (window.gsap && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        gsap.from('.blog-featured', { autoAlpha: 0, y: 24, duration: 0.7, ease: 'power3.out' });
        gsap.from('.blog-row', { autoAlpha: 0, y: 16, duration: 0.5, stagger: 0.07, delay: 0.15, ease: 'power3.out' });
      }
    })
    .catch(showError);
})();
</script>
