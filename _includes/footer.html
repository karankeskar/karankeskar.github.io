<!-- footer -->
<footer class="bg-primary footer-section">
  <div class="section">
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <h5 class="section-heading">Email</h5>
          <p class="paragraph-lg font-secondary">{{ site.data.settings.email }}</p>
        </div>
        <!-- <div class="col-md-4">
          <h5 class="section-heading">Phone</h5>
          <p class="paragraph-lg font-secondary">{{ site.data.settings.phone }}</p>
        </div> -->
        <div class="col-md-4">
          <h5 class="section-heading">Address</h5>
          <p class="paragraph-lg font-secondary">{{ site.data.settings.address }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="border-top text-center footer-divider py-3">
    <p class="mb-0 text-light">{{site.data.settings.copyright | markdownify}}</p>
  </div>
</footer>
<!-- /footer -->

<!-- JS Plugins -->
{% for js in site.data.plugins.js %}
<script src="{{ js | relative_url }}"></script>
{% endfor %}

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- Main Script -->
<script src="{{ '/assets/js/script.js' | relative_url }}?v={{ site.time | date: "%s" }}"></script>
<script src="{{ '/assets/js/animations.js' | relative_url }}?v={{ site.time | date: "%s" }}"></script>

<!-- Command palette (⌘K) -->
<script>
  window.CMDK_DATA = {
    baseurl: {{ site.baseurl | jsonify }},
    email: {{ site.data.settings.email | jsonify }},
    resume: {{ '/assets/resume/Karan_Keskar_Resume.pdf' | relative_url | jsonify }},
    social: [{% for social in site.data.settings.social %}{ icon: {{ social.icon | jsonify }}, link: {{ social.link | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}],
    projects: [{% for item in site.data.settings.portfolio-items %}{{ item.title | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]
  };
</script>
<script src="{{ '/assets/js/command-palette.js' | relative_url }}?v={{ site.time | date: "%s" }}"></script>
<script src="{{ '/assets/js/contact.js' | relative_url }}?v={{ site.time | date: "%s" }}"></script>
