{% if site.data.settings.skill-categories %}
<!-- skills -->
<section class="section section-decorated section-white" id="skills">
  <div class="container">
    <!-- Section Header -->
    <div class="row">
      <div class="col-12 text-center mb-5">
        <div class="section-eyebrow">Technical Proficiency</div>
        <h2 class="section-title section-heading mb-3">Skills &amp; Technologies</h2>
        <div class="section-divider"></div>
      </div>
    </div>

    <!-- Skills Grid -->
    <div class="row justify-content-center" style="position: relative; z-index: 2;">
      <div class="col-lg-10">
        {% for category in site.data.settings.skill-categories %}
        <div class="mb-5">
          <div class="mb-3 skills-category-header">
            <h3 class="skills-category-title">
              {{ category.category }}
            </h3>
            <div class="skills-category-line"></div>
          </div>

          <div class="d-flex flex-wrap skills-chip-row">
            {% for skill in category.skills %}
            <span class="skill-chip">
              {{ skill.name }}
            </span>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

</section>
<!-- /skills -->
{% endif %}
